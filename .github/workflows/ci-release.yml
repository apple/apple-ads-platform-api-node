name: Publish Library

permissions:
  contents: read
  # Lets npm exchange this run's OIDC token for a short-lived publish
  # credential (npm "trusted publishing"), so no npm token secret is needed.
  id-token: write

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npmjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          scope: '@apple'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      # Trusted publishing needs npm >= 11.5.1; make sure we have it
      # regardless of what the Node.js install above bundled.
      - run: npm install -g npm@latest
      - run: npm ci
      # npm's "prepack" lifecycle script (see package.json) syncs the
      # version and builds dist/ before this actually publishes.
      - run: npm publish --access public
